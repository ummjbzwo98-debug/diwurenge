<body>
  <main class="page">
    <section class="content">
      <h1>第五人格新賽季倒計時福利資訊</h1>
      <div class="subtitle">新賽季福利領取入口</div>

      <div class="divider"></div>

      <button class="claim-btn" id="claimBtn">立即領取</button>
      <div class="hint">點擊按鈕查看新賽季福利領取說明</div>
    </section>
  </main>

  <!-- 僅點擊「立即領取」後顯示 -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <h2>福利領取說明</h2>

      <p>
        本次新賽季福利發放，申領過程中需要驗證是否為首次領取，
        請耐心配合！<br><br>
        完成相關驗證後，即可繼續前往新賽季福利領取頁面。
      </p>

      <div class="modal-actions">
        <button class="close-btn" id="closeBtn">稍後再說</button>
        <button class="go-btn" id="goBtn">前往領取新賽季福利</button>
      </div>
    </div>
  </div>

<script>
  const claimBtn = document.getElementById("claimBtn");
  const modal = document.getElementById("modal");
  const closeBtn = document.getElementById("closeBtn");
  const goBtn = document.getElementById("goBtn");

  claimBtn.addEventListener("click", () => {
    modal.classList.add("show");
  });

  closeBtn.addEventListener("click", () => {
    modal.classList.remove("show");
  });

  modal.addEventListener("click", (event) => {
    if (event.target === modal) {
      modal.classList.remove("show");
    }
  });

  goBtn.addEventListener("click", () => {
   window.location.href = "https://lin.ee/PXpHGDy";
  });
</script>
