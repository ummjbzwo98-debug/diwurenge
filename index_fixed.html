<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; }
  body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    background: #111;
  }

  .page {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    z-index: 0;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.24) 55%, rgba(0,0,0,.48)),
      radial-gradient(circle at 50% 42%, rgba(255,255,255,.06), transparent 55%);
  }

  .content {
    position: relative;
    z-index: 2;
    width: min(900px, 100%);
    text-align: center;
    transform: translateY(-1vh);
  }

  .title, .subtitle {
    margin: 0;
    color: #fff1a8;
    font-weight: 900;
    letter-spacing: .08em;
    text-shadow:
      0 2px 0 rgba(91, 57, 0, .72),
      0 4px 12px rgba(0,0,0,.72),
      0 0 12px rgba(255, 226, 103, .78),
      0 0 26px rgba(255, 214, 75, .42);
  }

  .title {
    font-size: clamp(28px, 5vw, 58px);
    line-height: 1.2;
  }

  .subtitle {
    margin-top: 12px;
    font-size: clamp(25px, 4.2vw, 48px);
    line-height: 1.2;
  }

  .entry {
    margin: 28px auto 22px;
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: .05em;
    color: #fff;
    text-shadow: 0 3px 10px rgba(0,0,0,.9);
  }

  .claim-btn {
    border: 0;
    border-radius: 999px;
    padding: 15px 48px;
    min-width: 210px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .08em;
    color: #4c3200;
    background: linear-gradient(180deg, #fff3a6, #ffd85c);
    box-shadow:
      0 8px 24px rgba(0,0,0,.38),
      0 0 22px rgba(255,225,91,.65),
      inset 0 1px 0 rgba(255,255,255,.9);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .claim-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow:
      0 10px 28px rgba(0,0,0,.45),
      0 0 30px rgba(255,225,91,.82),
      inset 0 1px 0 rgba(255,255,255,.95);
  }

  .claim-btn:active { transform: scale(.98); }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.68);
    backdrop-filter: blur(5px);
  }

  .modal.show { display: flex; }

  .dialog {
    position: relative;
    width: min(560px, 100%);
    padding: 30px 28px 28px;
    border-radius: 18px;
    background: rgba(25, 28, 38, .96);
    border: 1px solid rgba(255,235,150,.5);
    box-shadow: 0 18px 60px rgba(0,0,0,.62), 0 0 30px rgba(255,220,100,.15);
    animation: pop .22s ease-out;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.94) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .close {
    position: absolute;
    top: 9px;
    right: 13px;
    width: 38px;
    height: 38px;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    opacity: .8;
  }

  .close:hover { opacity: 1; }

  .modal-title {
    margin: 0 30px 18px 0;
    color: #ffe98c;
    font-size: 25px;
    font-weight: 900;
  }

  .modal-text {
    margin: 0;
    color: #fff;
    font-size: 17px;
    line-height: 1.9;
    text-align: left;
  }

  .go-btn {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 0;
    background: linear-gradient(180deg, #ffe98c, #ffc94d);
    color: #4b3000;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(255,213,75,.28);
  }

  .go-btn:hover { filter: brightness(1.06); }

  @media (max-width: 600px) {
    .page { padding: 24px 14px; }
    .content { transform: translateY(-2vh); }
    .title { letter-spacing: .04em; }
    .subtitle { margin-top: 8px; letter-spacing: .04em; }
    .entry { margin-top: 22px; margin-bottom: 18px; }
    .claim-btn { width: min(260px, 90%); padding: 14px 24px; font-size: 18px; }
    .dialog { padding: 25px 20px 22px; }
    .modal-title { font-size: 21px; }
    .modal-text { font-size: 16px; }
  }
</style>

  closeBtn.addEventListener("click", closeModal);

  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  goBtn.addEventListener("click", () => {
    if (CLAIM_URL && CLAIM_URL !== "#") {
      window.location.href = CLAIM_URL;
    } else {
      alert("請先在 HTML 裡設定 CLAIM_URL 為你的福利領取網址。");
    }
  });
</script>
</body>
</html>
